<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muddamalla's TerraCircular | Premium Property & Financial Advisory</title>
    <style>
        :root {
            --royal-black: #0B0C10;
            --deep-gold: #8E6F3E;
            --bright-gold: #D4AF37;
            --metallic-gold: #C5A059;
            --champagne-gold: #F3E5AB;
            --creme-bg: #11141A;
            --white: #FFFFFF;
            --card-bg: #161A23;
            --font-display: 'Cinzel', 'Playfair Display', Georgia, serif;
            --font-sans: 'Montserrat', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            color: var(--champagne-gold);
            background-color: var(--royal-black);
            line-height: 1.7;
        }

        /* Royal Header Navigation */
        header {
            background: linear-gradient(to bottom, #000000, rgba(11, 12, 16, 0.95));
            border-bottom: 2px solid var(--deep-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Logo Configuration - Ensures Max Clarity */
        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--bright-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            image-rendering: -webkit-optimize-contrast; /* Webkit crispness */
            image-rendering: crisp-edges;
        }

        .brand-name h1 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: var(--bright-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .brand-name p {
            font-size: 0.85rem;
            color: var(--white);
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Premium Sub-Menu Navigation Modules */
        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--white);
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-family: var(--font-display);
            padding: 5px 10px;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--bright-gold);
            border-bottom: 2px solid var(--bright-gold);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        .cta-nav-btn {
            background: linear-gradient(135deg, var(--deep-gold), var(--bright-gold));
            color: var(--royal-black) !important;
            padding: 12px 25px !important;
            border-radius: 0px;
            font-weight: 700 !important;
            border: 1px solid var(--champagne-gold);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .cta-nav-btn:hover {
            background: linear-gradient(135deg, var(--bright-gold), var(--champagne-gold)) !important;
            border-bottom: 1px solid var(--champagne-gold) !important;
            transform: translateY(-2px);
        }

        /* Hero Showcase - Ultra Royal & Gold */
        .hero {
            background: radial-gradient(circle at center, rgba(142, 111, 62, 0.3) 0%, rgba(11, 12, 16, 1) 70%), url('https://unsplash.com') no-repeat center center/cover;
            padding: 140px 20px;
            text-align: center;
            border-bottom: 1px solid var(--deep-gold);
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(11, 12, 16, 0.85);
            padding: 50px;
            border: 1px solid var(--deep-gold);
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
        }

        .hero h2 {
            font-family: var(--font-display);
            font-size: 3.2rem;
            color: var(--white);
            margin-bottom: 25px;
            line-height: 1.3;
            letter-spacing: 1px;
        }

        .hero h2 span {
            color: var(--bright-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--champagne-gold);
            margin-bottom: 45px;
            opacity: 0.9;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--deep-gold), var(--bright-gold));
            color: var(--royal-black);
            padding: 18px 40px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            border: 1px solid var(--champagne-gold);
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, var(--bright-gold), var(--champagne-gold));
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }

        /* Strategic Advisory Modules */
        .section-container {
            max-width: 1300px;
            margin: 100px auto;
            padding: 0 20px;
        }

        .center-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--bright-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .gold-divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--bright-gold), transparent);
            margin: 0 auto;
        }

        /* Modules: About Section */
        #about p {
            max-width: 900px;
            margin: 30px auto 0 auto;
            font-size: 1.2rem;
            color: var(--white);
            text-align: center;
            opacity: 0.95;
        }

        /* Modules: Services Section Layout */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 5px;
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 50px 40px;
            border: 1px solid rgba(142, 111, 62, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--deep-gold), var(--bright-gold));
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: var(--bright-gold);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.15);
        }

        .service-card h4 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            margin-bottom: 25px;
            color: var(--bright-gold);
            letter-spacing: 1px;
        }

        .service-card ul {
            list-style: none;
        }

        .service-card ul li {
            margin-bottom: 15px;
            position: relative;
            padding-left: 25px;
            color: var(--white);
            font-size: 1.05rem;
        }

        .service-card ul li::before {
            content: '🔶';
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 0.8rem;
        }

        /* Modules: Advices Section Layout */
        .advices-panel {
            background: linear-gradient(135deg, var(--card-bg) 0%, #000000 100%);
            padding: 50px;
            border: 1px solid var(--deep-gold);
            margin-top: 40px;
        }

        .advice-item {
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding: 25px 0;
        }

        .advice-item:last-child {
            border-bottom: none;
        }

        .advice-item h5 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--bright-gold);
            margin-bottom: 10px;
        }

        /* Gold Registration Framework */
        .contact-section {
            max-width: 650px;
            margin: 120px auto;
            padding: 50px 40px;
            background-color: var(--card-bg);
            border: 1px solid var(--deep-gold);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .contact-form {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px;
            background-color: var(--royal-black);
